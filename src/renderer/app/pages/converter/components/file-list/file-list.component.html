<div class="head">{{ store.counts().all }}件</div>

<div class="list">
  @for (entry of store.entries(); track entry.input.path) {
    @let status = statusOf(entry);
    @let progress = progressOf(entry);
    <button
      type="button"
      class="row"
      [class.sel]="entry.input.path === store.selectedPath()"
      (click)="store.select(entry.input.path)"
    >
      <span
        class="tick"
        role="img"
        [class]="status.tone"
        [title]="status.label"
        [attr.aria-label]="status.label"
      ></span>
      <span class="name">
        <span class="head-part">{{ head(entry.name) }}</span
        ><span class="tail-part">{{ tail(entry.name) }}</span>
      </span>
      <span class="right" [class.run]="progress !== null">{{ right(entry) }}</span>

      <!-- 変換中の行だけ、進み具合を行の下辺に重ねる -->
      @if (progress !== null) {
        <span class="track"><i [style.width.%]="progress * 100"></i></span>
      }
    </button>
  } @empty {
    <p class="empty">ファイルがありません</p>
  }
</div>
